# XenonRecomp config for Saints Row (Title ID 545107D1, XEX version 1)
# Paths are relative to this file.

[main]
file_path = "../../Saints_Row_1_Modded.8/Saints Row 1 Modded/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "SaintsRow_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers (found by byte-pattern scan, each pattern is unique in .text)
restgprlr_14_address = 0x827028A0
savegprlr_14_address = 0x82702850
restfpr_14_address = 0x82702F5C
savefpr_14_address = 0x82702F10
restvmx_14_address = 0x8275B3E8
savevmx_14_address = 0x8275B150
restvmx_64_address = 0x8275B47C
savevmx_64_address = 0x8275B1E4

# longjmp: reads jmp_buf (lwz r0,312(r3)), calls RtlUnwind, then restores f14..f31
# setjmp: checks a hook pointer, then mflr/mfcr and stfd f14,0(r3)...
longjmp_address = 0x82701790
setjmp_address = 0x8275B080

