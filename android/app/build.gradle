plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saintsrow.port'
    compileSdk 35

    defaultConfig {
        applicationId 'com.saintsrow.port'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1-dev'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // Signed with the debug key for now so it can be sideloaded.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        // libsaintsrow.so is prebuilt by build_android.bat and copied into src/main/jniLibs.
        jniLibs.useLegacyPackaging = true
    }
}
